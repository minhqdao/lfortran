name: probe homebrew llvm

# Temporary probe for lfortran/lfortran#13888.
#
# Findings so far, all on x86_64 in ghcr.io/homebrew/brew:main:
#   - lfortran v0.66.0 built in-tree against Homebrew's LLVM 23.1.2 segfaults on
#     `-c hello.f90` (139). So the crash is the build, not the bottle/install path.
#   - The same source against conda-forge llvmdev 23.1.2 on the same runner,
#     outside the container, is green. So the LLVM patch version is not the variable.
#   - Backtrace: SIGSEGV in the X86 backend reached from the legacy pass manager,
#     via getTargetTransformInfo -> getSubtargetImpl -> X86Subtarget ->
#     X86GenSubtargetInfo -> X86ReadAdvanceTable, inside LLVMValuator::save_object_file.
#   - `info sharedlibrary` shows no libLLVM.so: LLVM is linked statically into
#     the lfortran binary.
#
# This run pins down which of those two facts matters: the link line and the
# faulting instruction, plus whether Homebrew's own tools (which link the dylib)
# are fine on the same backend. A working `llc` against a crashing lfortran would
# point at Homebrew's static archives rather than at LLVM or at lfortran.
#
# Container gotchas, each of which cost a run. The job runs as uid=1000(linuxbrew):
#   - `/__w/_temp/_runner_file_commands/` is root-owned, so any JS action
#     (`actions/checkout`, `setup-micromamba`) dies with EACCES on `save_state_*`.
#   - `$GITHUB_WORKSPACE` and `$HOME` (= `/github/home`) are both root-owned.
#   - writable: `/tmp` and `/home/linuxbrew`.
# The tap's own CI never checks out and never writes those paths, which is why
# none of this is visible from reading `tests.yml`.

on:
  push:
    branches:
      - probe/homebrew-llvm
  workflow_dispatch:

jobs:
  probe:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    container:
      image: ghcr.io/homebrew/brew:main
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: homebrew-llvm + formula flags
            llvm: homebrew
            flags: formula
          - name: conda-llvm + upstream flags
            llvm: conda
            flags: upstream

    steps:
      - name: Where can we write
        shell: bash -e -l {0}
        run: |
          id
          echo "HOME=${HOME}  PWD=$(pwd)  WORKSPACE=${GITHUB_WORKSPACE}"
          for d in /tmp "${HOME}" "${GITHUB_WORKSPACE}" /home/linuxbrew; do
            if touch "${d}/.wtest" 2>/dev/null; then
              echo "writable:   ${d}"; rm -f "${d}/.wtest"
            else
              echo "READ-ONLY:  ${d}"
            fi
          done

      # The release asset, not a git tag: this is exactly what the formula
      # builds. It contains no build0.sh -- the generated sources are pre-baked --
      # which is why -DLFORTRAN_BUILD_ALL is a no-op here.
      - name: Fetch source
        shell: bash -e -l {0}
        run: |
          curl -sSL -o /tmp/lfortran.tar.gz \
            https://github.com/lfortran/lfortran/releases/download/v0.66.0/lfortran-0.66.0.tar.gz
          echo "961d84f49d07951a279b7835e0f9864489a167a80a8c3c502a797fb6c61669c7  /tmp/lfortran.tar.gz" \
            | sha256sum -c -
          mkdir -p /tmp/probe/src
          tar xzf /tmp/lfortran.tar.gz -C /tmp/probe/src --strip-components=1

      - name: Install Homebrew LLVM, cmake, ninja, gdb
        if: matrix.llvm == 'homebrew'
        shell: bash -e -l {0}
        run: |
          brew install llvm z3 zlib cmake ninja gdb
          brew --prefix llvm

      # Installed by hand rather than with setup-micromamba, for the same reason
      # there is no checkout: it is a JS action. HOME is repointed at /tmp
      # because /github/home is read-only and micromamba writes $HOME/.mamba.
      - name: Install conda LLVM
        if: matrix.llvm == 'conda'
        shell: bash -e -l {0}
        run: |
          export HOME=/tmp
          export MAMBA_ROOT_PREFIX=/tmp/mmroot
          curl -sSL -o /tmp/micromamba \
            https://github.com/mamba-org/micromamba-releases/releases/latest/download/micromamba-linux-64
          chmod +x /tmp/micromamba
          /tmp/micromamba create -y -p /tmp/lf -c conda-forge \
            llvmdev=23.1.2 libunwind=1.7.2 zlib bison=3.4 re2c=3.1 \
            cmake=3.29.1 ninja=1.11.1 make=4.3 binutils=2.45.1 zstd-static=1.5.7

      - name: LLVM facts
        shell: bash -e -l {0}
        run: |
          set +e
          if [[ "${{ matrix.llvm }}" == homebrew ]]; then
            PREFIX="$(brew --prefix llvm)"
          else
            PREFIX="/tmp/lf"
          fi
          echo "prefix: ${PREFIX}"
          "${PREFIX}/bin/llvm-config" --version --assertion-mode --has-rtti --targets-built
          grep -rh "LLVM_NATIVE_ARCH\|LLVM_LINK_LLVM_DYLIB" "${PREFIX}"/lib/cmake/llvm/LLVMConfig.cmake
          grep -E "^#define LLVM_ENABLE" "${PREFIX}"/include/llvm/Config/abi-breaking.h
          echo "--- libLLVM.so ---"
          ls -l "${PREFIX}"/lib/libLLVM.so* 2>/dev/null | head -3
          echo "--- component archives present: $(ls "${PREFIX}"/lib/libLLVM*.a 2>/dev/null | wc -l) ---"

      - name: Build
        shell: bash -e -l {0}
        run: |
          cd /tmp/probe/src
          if [[ "${{ matrix.llvm }}" == homebrew ]]; then
            PREFIX_ARGS="-DCMAKE_PREFIX_PATH=$(brew --prefix llvm);$(brew --prefix z3);$(brew --prefix zlib)"
            TRAP="$(brew --repo)/Library/Homebrew/cmake/trap_fetchcontent_provider.cmake"
            TRAP_ARG=""
            [[ -f "${TRAP}" ]] && TRAP_ARG="-DCMAKE_PROJECT_TOP_LEVEL_INCLUDES=${TRAP}"
          else
            export PATH="/tmp/lf/bin:${PATH}"
            PREFIX_ARGS="-DCMAKE_PREFIX_PATH=/tmp/lf"
            TRAP_ARG=""
          fi

          if [[ "${{ matrix.flags }}" == formula ]]; then
            # Exactly what Formula/lfortran.rb passes on Linux (std_cmake_args
            # plus three flags), with -g appended so the crash site is nameable.
            cmake . -GNinja \
              -DCMAKE_INSTALL_PREFIX="$(pwd)/inst" \
              -DCMAKE_INSTALL_LIBDIR=lib \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_FIND_FRAMEWORK=LAST \
              -DCMAKE_VERBOSE_MAKEFILE=ON \
              -Wno-author \
              -DBUILD_TESTING=OFF \
              -DCCACHE_FOUND=OFF \
              -DCMAKE_CXX_FLAGS_RELEASE="-O3 -funroll-loops -DNDEBUG -g" \
              -DWITH_LLVM=ON \
              -DWITH_LSP=yes \
              ${TRAP_ARG} \
              "${PREFIX_ARGS}"
          else
            # Upstream's own recipe (Exhaustive-Checks-CI.yml at v0.66.0), minus
            # the sccache launchers, with -g.
            cmake . -GNinja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_CXX_FLAGS_RELEASE="-O3 -funroll-loops -DNDEBUG -g" \
              -DWITH_LLVM=yes \
              -DWITH_LSP=yes \
              -DLFORTRAN_BUILD_ALL=no \
              -DWITH_STACKTRACE=no \
              -DCMAKE_INSTALL_PREFIX="$(pwd)/inst" \
              "${PREFIX_ARGS}"
          fi

          cmake --build . -j"$(nproc)" --target install

      # How LLVM actually got linked decides how to read the crash. lfortran's
      # CMake takes the `llvm_map_components_to_libnames` branch when `LLVMCore`
      # exists, and the bare `LLVM` branch otherwise; Homebrew ships both the
      # dylib and every component archive.
      - name: Link topology
        if: always()
        shell: bash -e -l {0}
        run: |
          set +e
          cd /tmp/probe/src
          echo "--- lfortran link line: LLVM references ---"
          find . -name link.txt | while read -r f; do
            echo "## ${f}"
            tr ' ' '\n' < "${f}" | grep -iE "llvm" | sed 's#.*/##' | sort | uniq -c | sort -rn | head -25
          done
          echo "--- ldd ---"
          ldd inst/bin/lfortran
          echo "--- X86ReadAdvanceTable definitions ---"
          PREFIX="$(brew --prefix llvm)"
          for f in "${PREFIX}"/lib/libLLVM.so.23.1 "${PREFIX}"/lib/libLLVMX86*.a; do
            printf '%s: %s\n' "$(basename "$f")" \
              "$(nm -A --defined-only "$f" 2>/dev/null | grep -c 'X86ReadAdvanceTable')"
          done
          printf 'lfortran binary: %s\n' \
            "$(nm --defined-only inst/bin/lfortran 2>/dev/null | grep -c 'X86ReadAdvanceTable')"

      # Homebrew's own tools link the dylib, lfortran links the archives. If llc
      # is fine on the same backend, the archives are the suspect, not LLVM.
      - name: Homebrew's own LLVM tools on the same backend
        if: always() && matrix.llvm == 'homebrew'
        shell: bash -e -l {0}
        run: |
          set +e
          PREFIX="$(brew --prefix llvm)"
          echo "--- does llc link the dylib? ---"
          ldd "${PREFIX}/bin/llc" | grep -i llvm
          cat > /tmp/hello.ll <<'EOF'
          define i32 @main() {
            %1 = add i32 1, 2
            ret i32 %1
          }
          EOF
          "${PREFIX}/bin/llc" -O2 -filetype=obj /tmp/hello.ll -o /tmp/llc-hello.o
          echo "!! llc exit: $?  obj: $(ls -l /tmp/llc-hello.o 2>/dev/null | awk '{print $5}')"
          printf 'int f(int x) { return x + 1; }\n' > /tmp/hello.c
          "${PREFIX}/bin/clang" -O2 -c /tmp/hello.c -o /tmp/clang-hello.o
          echo "!! clang exit: $?  obj: $(ls -l /tmp/clang-hello.o 2>/dev/null | awk '{print $5}')"

      - name: Probe hello world
        if: always()
        shell: bash -e -l {0}
        run: |
          set +e
          cd /tmp/probe/src
          LF="$(pwd)/inst/bin/lfortran"
          echo "=== ${{ matrix.name }} ==="
          if [[ ! -x "${LF}" ]]; then
            echo "!! build produced no lfortran binary"
            exit 0
          fi
          "${LF}" --version
          echo "!! --version exit: $?"
          printf 'program hello\n  print *, "Hello, World!"\nend program hello\n' > /tmp/hello.f90
          "${LF}" -c /tmp/hello.f90 -o /tmp/hello.o
          echo "!! -c exit: $?"
          "${LF}" /tmp/hello.f90 -o /tmp/hello
          echo "!! full exit: $?"
          /tmp/hello
          echo "!! run exit: $?"

      # The whole point: name the instruction, not just the function.
      - name: Backtrace
        if: always()
        shell: bash -e -l {0}
        run: |
          set +e
          cd /tmp/probe/src
          if ! command -v gdb >/dev/null; then
            echo "!! no gdb available, skipping backtrace"
            exit 0
          fi
          printf 'program hello\n  print *, "Hello, World!"\nend program hello\n' > /tmp/hello.f90
          gdb -batch -nx \
            -ex "set pagination off" \
            -ex "run -c /tmp/hello.f90 -o /tmp/hello.o" \
            -ex "printf \"\\n=== fault ===\\n\"" \
            -ex "p/x \$pc" \
            -ex "info symbol \$pc" \
            -ex "x/6i \$pc" \
            -ex "p \$_siginfo._sifields._sigfault.si_addr" \
            -ex "info registers" \
            -ex "printf \"\\n=== bt ===\\n\"" \
            -ex "bt" \
            --args "$(pwd)/inst/bin/lfortran"
