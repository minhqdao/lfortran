name: probe homebrew llvm

# Temporary probe for lfortran/lfortran#13888.
#
# The tap's CI builds lfortran v0.66.0 against Homebrew's LLVM 23.1.2 inside
# ghcr.io/homebrew/brew:main on x86_64 and `lfortran -c hello.f90` dies with
# SIGSEGV. The same source against conda-forge's llvmdev 23.1.2 on the same
# runner, outside the container, is green -- so the LLVM patch version is not
# the variable. This probe holds the container fixed and moves one thing at a
# time, and asks for a backtrace instead of guessing at a mechanism.
#
#   homebrew-llvm + formula flags   expect 139; gives the crash site
#   conda-llvm    + upstream flags  isolates the container toolchain from LLVM
#
# Both cells build in-tree (not through `brew bottle`), so a green homebrew
# cell would also tell us the crash is introduced by the bottle/install path
# rather than by the build.
#
# No `uses:` steps anywhere, and nothing written under $GITHUB_WORKSPACE: the brew
# container's default user (linuxbrew) can write neither the runner's file-command
# directory (`/__w/_temp/_runner_file_commands/save_state_*`) nor the workspace
# itself (`/__w/<repo>/<repo>`, root-owned). `actions/checkout` dies with EACCES on
# the first, and `mkdir` on the second. So the source is curled into $HOME/probe.
# The tap's own CI never checks out and never writes the workspace, which is why
# neither trap is visible from reading `tests.yml`.

on:
  # A push trigger, not workflow_dispatch: GitHub only dispatches a workflow
  # that exists on the default branch, and this probe must not touch main.
  push:
    branches:
      - probe/homebrew-llvm
  workflow_dispatch:

jobs:
  probe:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    container:
      image: ghcr.io/homebrew/brew:main
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: homebrew-llvm + formula flags
            llvm: homebrew
            flags: formula
          - name: conda-llvm + upstream flags
            llvm: conda
            flags: upstream

    steps:
      # The release asset, not a git tag: this is exactly what the formula
      # builds. Note it contains no build0.sh -- the generated sources are
      # pre-baked -- which is why -DLFORTRAN_BUILD_ALL is a no-op here.
      - name: Fetch source
        shell: bash -e -l {0}
        run: |
          curl -sSL -o /tmp/lfortran.tar.gz \
            https://github.com/lfortran/lfortran/releases/download/v0.66.0/lfortran-0.66.0.tar.gz
          echo "961d84f49d07951a279b7835e0f9864489a167a80a8c3c502a797fb6c61669c7  /tmp/lfortran.tar.gz" \
            | sha256sum -c -
          mkdir -p "$HOME/probe/src"
          tar xzf /tmp/lfortran.tar.gz -C "$HOME/probe/src" --strip-components=1

      - name: Install Homebrew LLVM and gdb
        if: matrix.llvm == 'homebrew'
        shell: bash -e -l {0}
        run: |
          brew install llvm z3 zlib gdb
          brew --prefix llvm

      # Installed by hand rather than with setup-micromamba, for the same reason
      # there is no checkout: it is a JS action.
      - name: Install conda LLVM
        if: matrix.llvm == 'conda'
        shell: bash -e -l {0}
        run: |
          curl -sSL -o /tmp/micromamba \
            https://github.com/mamba-org/micromamba-releases/releases/latest/download/micromamba-linux-64
          chmod +x /tmp/micromamba
          export MAMBA_ROOT_PREFIX=/tmp/mmroot
          /tmp/micromamba create -y -p /tmp/lf -c conda-forge \
            llvmdev=23.1.2 libunwind=1.7.2 bison=3.4 re2c=3.1 \
            cmake=3.29.1 ninja=1.11.1 make=4.3 binutils=2.45.1 zstd-static=1.5.7

      # If the two cells disagree, this is where the disagreement will show.
      - name: LLVM facts
        shell: bash -e -l {0}
        run: |
          set +e
          if [[ "${{ matrix.llvm }}" == homebrew ]]; then
            PREFIX="$(brew --prefix llvm)"
          else
            PREFIX="/tmp/lf"
          fi
          echo "prefix: ${PREFIX}"
          "${PREFIX}/bin/llvm-config" --version --assertion-mode --has-rtti --targets-built
          echo "--- LLVM_NATIVE_ARCH ---"
          grep -rh "LLVM_NATIVE_ARCH" "${PREFIX}"/lib/cmake/llvm/LLVMConfig.cmake
          echo "--- abi-breaking.h ---"
          grep -E "^#define LLVM_ENABLE" "${PREFIX}"/include/llvm/Config/abi-breaking.h
          echo "--- libLLVM ---"
          ls -l "${PREFIX}"/lib/libLLVM* 2>/dev/null | head

      - name: Build
        shell: bash -e -l {0}
        run: |
          cd "$HOME/probe/src"
          if [[ "${{ matrix.llvm }}" == homebrew ]]; then
            LLVM_PREFIX="$(brew --prefix llvm)"
            PREFIX_ARGS="-DCMAKE_PREFIX_PATH=${LLVM_PREFIX};$(brew --prefix z3);$(brew --prefix zlib)"
          else
            PREFIX_ARGS="-DCMAKE_PREFIX_PATH=/tmp/lf"
          fi

          if [[ "${{ matrix.flags }}" == formula ]]; then
            # Exactly what Formula/lfortran.rb passes on Linux (std_cmake_args
            # plus three flags), with -g appended so the crash site is nameable.
            cmake . -GNinja \
              -DCMAKE_INSTALL_PREFIX="$(pwd)/inst" \
              -DCMAKE_INSTALL_LIBDIR=lib \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_FIND_FRAMEWORK=LAST \
              -DCMAKE_VERBOSE_MAKEFILE=ON \
              -DCMAKE_PROJECT_TOP_LEVEL_INCLUDES="$(brew --repo)/Library/Homebrew/cmake/trap_fetchcontent_provider.cmake" \
              -Wno-author \
              -DBUILD_TESTING=OFF \
              -DCCACHE_FOUND=OFF \
              -DCMAKE_CXX_FLAGS_RELEASE="-O3 -funroll-loops -DNDEBUG -g" \
              -DWITH_LLVM=ON \
              -DWITH_LSP=yes \
              "${PREFIX_ARGS}"
          else
            # Upstream's own recipe (Exhaustive-Checks-CI.yml at v0.66.0), minus
            # the sccache launchers, with -g. LFORTRAN_BUILD_ALL is off because
            # the release asset has no build0.sh to run.
            cmake . -GNinja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_CXX_FLAGS_RELEASE="-O3 -funroll-loops -DNDEBUG -g" \
              -DWITH_LLVM=yes \
              -DWITH_LSP=yes \
              -DLFORTRAN_BUILD_ALL=no \
              -DWITH_STACKTRACE=no \
              -DCMAKE_INSTALL_PREFIX="$(pwd)/inst" \
              "${PREFIX_ARGS}"
          fi

          cmake --build . -j"$(nproc)" --target install

      - name: Probe hello world
        if: always()
        shell: bash -e -l {0}
        run: |
          set +e
          cd "$HOME/probe/src"
          LF="$(pwd)/inst/bin/lfortran"
          echo "=== ${{ matrix.name }} ==="
          if [[ ! -x "${LF}" ]]; then
            echo "!! build produced no lfortran binary"
            exit 0
          fi
          "${LF}" --version
          echo "!! --version exit: $?"
          printf 'program hello\n  print *, "Hello, World!"\nend program hello\n' > /tmp/hello.f90
          "${LF}" -c /tmp/hello.f90 -o /tmp/hello.o
          echo "!! -c exit: $?"
          "${LF}" /tmp/hello.f90 -o /tmp/hello
          echo "!! full exit: $?"
          /tmp/hello
          echo "!! run exit: $?"

      # The whole point: name the function instead of arguing about mechanisms.
      - name: Backtrace
        if: always()
        shell: bash -e -l {0}
        run: |
          set +e
          cd "$HOME/probe/src"
          if ! command -v gdb >/dev/null; then
            echo "!! no gdb available, skipping backtrace"
            exit 0
          fi
          printf 'program hello\n  print *, "Hello, World!"\nend program hello\n' > /tmp/hello.f90
          gdb -batch -nx \
            -ex "set pagination off" \
            -ex "run -c /tmp/hello.f90 -o /tmp/hello.o" \
            -ex "bt" \
            -ex "info sharedlibrary" \
            --args "$(pwd)/inst/bin/lfortran"
