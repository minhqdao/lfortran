name: omit-exports build failure

on:
  push:
    branches: [probe/omit-build]
  workflow_dispatch:

jobs:
  omit:
    name: omit-exports, compiler only
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/homebrew/brew:main
      options: --privileged
    defaults:
      run:
        shell: bash -e -l {0}
    steps:
      - name: Install Homebrew LLVM, cmake, ninja, gdb
        run: brew install llvm z3 zlib cmake ninja gdb

      - name: Fetch source
        run: |
          curl -sSL -o /tmp/lfortran.tar.gz \
            https://github.com/lfortran/lfortran/releases/download/v0.66.0/lfortran-0.66.0.tar.gz
          echo "961d84f49d07951a279b7835e0f9864489a167a80a8c3c502a797fb6c61669c7  /tmp/lfortran.tar.gz" \
            | sha256sum -c -
          mkdir -p /tmp/src
          tar xzf /tmp/lfortran.tar.gz -C /tmp/src --strip-components=1

      - name: Configure with omit-exports
        run: |
          set +e
          PREFIX="$(brew --prefix llvm)"
          cd /tmp/src
          cmake . -GNinja -B build \
            -DCMAKE_INSTALL_PREFIX=/tmp/inst \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS_RELEASE="-O3 -funroll-loops -DNDEBUG -g" \
            -DWITH_LLVM=ON \
            -DWITH_LSP=yes \
            -DLLVM_OMIT_EXPORTS_FROM_CONFIG=ON \
            -DCMAKE_EXE_LINKER_FLAGS="-L${PREFIX}/lib" \
            -DCMAKE_PREFIX_PATH="${PREFIX};$(brew --prefix z3);$(brew --prefix zlib)" \
            > /tmp/configure.log 2>&1
          echo "!! configure exit: $?"
          if [[ ! -f build/build.ninja ]]; then
            echo "no build.ninja:"; tail -40 /tmp/configure.log; exit 0
          fi
          echo "--- link tokens ---"
          grep -oE '(-lLLVM[A-Za-z0-9_.-]*|libLLVM[A-Za-z0-9_.-]*\.(a|so[0-9.]*))' build/build.ninja \
            | sed 's#.*/##' | sort -u
          echo "--- lfortran link command, LLVM parts ---"
          ninja -C build -t commands lfortran 2>/dev/null | tail -1 \
            | tr ' ' '\n' | grep -iE 'llvm' | sed 's#.*/##' | sort -u

      - name: Build just the lfortran target
        run: |
          set +e
          cd /tmp/src
          cmake --build build --target lfortran -j"$(nproc)" > /tmp/build-lfortran.log 2>&1
          echo "!! target lfortran exit: $?"
          grep -n -B2 -A20 'FAILED' /tmp/build-lfortran.log | head -60
          echo "--- tail ---"
          tail -20 /tmp/build-lfortran.log

      - name: Build everything, keep going
        run: |
          set +e
          cd /tmp/src
          cmake --build build -j"$(nproc)" -k 0 > /tmp/build-all.log 2>&1
          echo "!! build all exit: $?"
          echo "--- FAILED count: $(grep -c 'FAILED' /tmp/build-all.log) ---"
          grep -n -A14 'FAILED' /tmp/build-all.log | head -70

      - name: Install and run
        run: |
          set +e
          cd /tmp/src
          cmake --install build > /tmp/install.log 2>&1
          echo "!! install exit: $?"
          printf 'program hello\n  print *, "Hello, World!"\nend program hello\n' > /tmp/hello.f90
          B=/tmp/inst/bin/lfortran
          [[ -x $B ]] || { echo "no lfortran binary"; exit 0; }
          echo "--- what does it load? ---"
          ldd "$B" | grep -i 'libLLVM' || echo "  no libLLVM.so -> still static"
          echo "--- --version ---"
          "$B" --version; echo "!! --version exit: $?"
          echo "--- -c ---"
          "$B" -c /tmp/hello.f90 -o /tmp/hello.o; echo "!! -c exit: $?"
          echo "--- full compile ---"
          "$B" /tmp/hello.f90 -o /tmp/hello; echo "!! full exit: $?"
          if [[ -x /tmp/hello ]]; then /tmp/hello; echo "!! run exit: $?"; else echo "  no executable produced"; fi
          echo "--- backtrace if it crashed ---"
          if [[ ! -s /tmp/hello.o && -x $B ]]; then
            gdb -batch -nx -ex "set pagination off" \
              -ex "run -c /tmp/hello.f90 -o /tmp/hello.o" \
              -ex "p/x \$pc" -ex "info symbol \$pc" \
              -ex "p \$_siginfo._sifields._sigfault.si_addr" -ex "bt" \
              --args "$B" 2>&1 | tail -25
          fi
